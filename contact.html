<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" data-meta-content="contact.meta_description" content="歡迎聯繫有意思行銷，取得網站、曝光、口碑與 Google 商家整合報價建議。">

  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="contact">
  <header class="site-header"><div class="container header-inner"><a class="brand" href="index.html" aria-label="回到首頁"><span class="brand-mark">GH</span><span class="brand-text"><strong data-field="site.company_name">有意思行銷</strong><small data-field="site.english_name">Interesting Marketing</small></span></a><button class="menu-toggle" type="button" aria-label="切換選單" aria-expanded="false"><span></span><span></span><span></span></button><div class="header-actions"><nav class="site-nav"><a href="index.html" data-nav="home" data-field="navigation.home">首頁</a><a href="about.html" data-nav="about" data-field="navigation.about">關於我們</a><a href="products.html" data-nav="products" data-field="navigation.products">產品服務</a><a href="technology.html" data-nav="technology" data-field="navigation.technology">設備技術</a><a href="quality.html" data-nav="quality" data-field="navigation.quality">品質認證</a><a href="contact.html" data-nav="contact" data-field="navigation.contact">聯絡我們</a></nav><div class="language-switch" aria-label="Language switcher"><button type="button" data-language-option="zh" aria-pressed="false">中文</button><button type="button" data-language-option="en" aria-pressed="false">EN</button></div></div></div></header>
  <main>
    <section class="page-hero"><div class="container page-hero-grid"><div><p class="eyebrow" data-field="contact.eyebrow">聯絡我們</p><h1 data-field="contact.page_title">歡迎與我們討論你的成長目標</h1><p class="hero-text" data-field="contact.page_description">請留下需求，我們將由專員提供合適的整合方案與時程建議。</p></div><div class="image-placeholder image-wide has-image"><img class="media-image" src="images/contact-hero_image_title.jpg" alt="聯絡頁主圖區" loading="lazy"></div></div></section>
    <section class="section contact-section"><div class="container contact-layout"><div class="detail-card"><h3 data-field="contact.contact_title">聯絡資訊</h3><div class="contact-info"><p><strong data-field="contact.phone_label">總機</strong>：<span data-field="contact.phone_value">（請填寫公司電話）</span></p><p><strong data-field="contact.fax_label">傳真</strong>：<span data-field="contact.fax_value">（請填寫備用電話 / LINE）</span></p><p><strong data-field="contact.address_label">地址</strong>：<span data-field="contact.address_value">（請填寫公司地址）</span></p><p><strong data-field="contact.email_label">報價信箱</strong>：<a href="mailto:quote@interestingmarketing.com" data-field="contact.email_value" data-mailto="contact.email_value">quote@interestingmarketing.com</a></p><p><strong data-field="contact.map_label">Google Map</strong>：<a href="https://maps.google.com" target="_blank" rel="noreferrer" data-field="contact.map_text" data-href="contact.map_href">查看 Google 地圖</a></p></div><div class="image-placeholder image-card has-image"><img class="media-image" src="images/contact-map_image_title.jpg" alt="地圖或門面照片區" loading="lazy"></div></div><form class="contact-form"><label><span data-field="contact.form_company">公司名稱</span><input type="text" name="company" placeholder="請輸入公司名稱" data-placeholder="contact.form_company_placeholder"></label><label><span data-field="contact.form_name">聯絡人</span><input type="text" name="name" placeholder="請輸入聯絡人姓名" data-placeholder="contact.form_name_placeholder"></label><label><span data-field="contact.form_email">E-mail</span><input type="email" name="email" placeholder="請輸入聯絡 Email" data-placeholder="contact.form_email_placeholder"></label><label><span data-field="contact.form_product">產品 / 服務需求項目</span><input type="text" name="product" placeholder="例如：網站改版、內容行銷、Google 商家經營" data-placeholder="contact.form_product_placeholder"></label><label><span data-field="contact.form_volume">預計預算 / 規模</span><input type="text" name="volume" placeholder="例如：每月預算、專案規模或預期時程" data-placeholder="contact.form_volume_placeholder"></label><label><span data-field="contact.form_message">目前網站網址（如有）與補充需求</span><textarea name="message" rows="5" placeholder="請填寫目前網站網址（如有）、目標與補充說明" data-placeholder="contact.form_message_placeholder"></textarea></label><button class="button button-primary full" type="submit" data-field="contact.form_submit">送出詢價需求</button></form></div></section>
  </main>
  <footer class="site-footer"><div class="container footer-inner"><p>© 2026 <span data-field="site.company_name_full">有意思行銷有限公司</span>. All Rights Reserved.</p><p data-field="site.footer_text">網站架設｜內容行銷｜口碑經營｜Google 商家優化</p></div></footer>

  <script src="content-store.js"></script>
  <script src="content-loader.js"></script>
  <script src="script.js"></script>
</body>
</html>
